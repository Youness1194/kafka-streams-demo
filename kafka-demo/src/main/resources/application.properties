
spring.application.name=kafka-demo
server.port=8080

spring.kafka.bootstrap-servers=localhost:9092

spring.cloud.stream.defaultBinder=kafka

spring.cloud.function.definition=pageEventConsumer;pageEventSupplier

spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=page-event-group
spring.cloud.stream.bindings.pageEventConsumer-in-0.binder=kafka

spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T3
spring.cloud.stream.bindings.pageEventSupplier-out-0.binder=kafka

spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200