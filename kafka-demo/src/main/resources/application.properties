
spring.application.name=kafka-demo
server.port=8080

spring.kafka.bootstrap-servers=localhost:9092

spring.cloud.stream.defaultBinder=kafka

spring.cloud.function.definition=pageEventConsumer

spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=page-event-group
spring.cloud.stream.bindings.pageEventConsumer-in-0.binder=kafka
